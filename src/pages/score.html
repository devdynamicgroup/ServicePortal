<div id="s-score" class="screen">
  <div class="hdr">
    <button class="hdr-back" type="button" onclick="goBack('s-assess')" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span class="hdr-title" data-i18n="score.title">Water Score</span>
    <button class="hdr-action" type="button" onclick="shareScore()" data-i18n="score.share">Share Score</button>
  </div>

  <div class="content-bare score-scroll">
    <section class="score-report" id="score-hero">
      <div class="score-report-inner score-reveal">
        <div class="score-summary-card">
          <div class="score-summary-head">
            <div class="score-summary-score">
              <span class="score-summary-num" id="gauge-val">—</span>
              <span class="score-summary-den">/100</span>
            </div>
            <div class="score-summary-meta">
              <span class="score-summary-count" id="score-indicator-count">8 <span data-i18n="score.indicators">Indicators</span></span>
              <span class="score-summary-badge" id="score-summary-band">—</span>
            </div>
          </div>
          <div class="score-progress" id="score-status-bar" role="img" aria-label="Water Score level">
            <div class="score-progress-segments" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="score-progress-fill" id="score-progress-fill"></div>
            <span class="score-progress-knob" id="score-progress-knob" aria-hidden="true"></span>
          </div>
          <div class="score-progress-ticks" aria-hidden="true">
            <span>0</span>
            <span id="score-tick-thai">50 &middot; Thai</span>
            <span id="score-tick-intl">80 &middot; Int'l</span>
            <span>100</span>
          </div>
          <p class="score-summary-note" id="score-summary-note"></p>
        </div>

        <div class="score-readiness" id="score-readiness" hidden>
          <span class="score-readiness-icon" aria-hidden="true">
            <svg class="score-readiness-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
          </span>
          <div class="score-readiness-copy">
            <strong id="score-readiness-title">Gathering readings</strong>
            <p id="score-readiness-text">Some measurements are still missing. Photos will appear here once captured.</p>
          </div>
        </div>

        <section class="score-improve" id="score-improve-section" hidden>
          <h2 class="score-improve-title">
            <span id="score-improve-heading" data-i18n="score.improveTitle">Room to improve</span>
            <span id="score-improve-count"></span>
          </h2>
          <div id="score-improve-list" class="score-improve-list"></div>
        </section>

        <section class="score-all-good" id="score-all-good" hidden>
          <div class="score-all-good-card">
            <span class="score-all-good-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            <span class="score-all-good-text" id="score-all-good-text">All indicators at international-level quality</span>
          </div>
        </section>

        <div class="score-filter-row">
          <div class="score-select-wrap" id="score-room-select-wrap">
            <select class="score-select" id="score-room-select" aria-label="Location"></select>
          </div>
          <div class="score-select-wrap score-benchmark-wrap">
            <label class="score-benchmark-label" for="score-standard-select" data-i18n="score.benchmark">Benchmark</label>
            <select class="score-select" id="score-standard-select" aria-label="Reference standard"></select>
          </div>
        </div>

        <div class="score-photo-carousel" id="score-photo-carousel" hidden>
          <div class="score-photo-track" id="score-photo-track"></div>
          <div class="score-photo-dots" id="score-photo-dots"></div>
        </div>
        <div class="score-photo-placeholder" id="score-photo-placeholder" hidden>
          <span class="score-photo-placeholder-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </span>
          <span class="score-photo-placeholder-text" id="score-photo-placeholder-text">Photos will appear once captured</span>
        </div>

        <p class="score-params-scope" id="score-params-scope" hidden data-i18n="score.paramsOverall">Overall average across taps</p>
        <div class="score-metric-list" id="score-readings-rows"></div>
      </div>
    </section>
  </div>

  <div class="foot">
    <button class="btn btn-secondary btn-draft" type="button" onclick="showPkgSheet()" data-i18n="common.upgrade">Upgrade</button>
    <button class="btn btn-primary" type="button" onclick="completeScore()" data-i18n="common.complete">Complete</button>
  </div>
</div>
