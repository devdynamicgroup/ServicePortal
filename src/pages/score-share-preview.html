<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Score share card preview · Water Motion</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Geist, Inter, system-ui, sans-serif;
      background: #f5f4f1;
      color: #0c0a09;
      padding: 32px 20px 64px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #78716c; margin: 0 0 28px; max-width: 640px; line-height: 1.5; }
    .grid { display: grid; gap: 28px; }
    figure {
      margin: 0;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(12,10,9,.06);
    }
    figcaption {
      font-size: 13px;
      font-weight: 600;
      color: #57534e;
      margin-bottom: 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #e7e5e1;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      align-items: end;
    }
    label { font-size: 12px; color: #78716c; display: grid; gap: 4px; }
    input, button {
      font: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #d6d3d1;
    }
    button {
      background: #284dcd;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>LINE / share score cards</h1>
  <p>
    Templates for when a customer views results via LINE.
    Dynamic: photo + score card. Static: headline, logo, QR CTA.
    Mild photo filter keeps light/dark site photos in one brand tone.
  </p>

  <div class="controls">
    <label>Score
      <input id="score" type="number" min="0" max="100" value="65">
    </label>
    <label>Photo URL (optional)
      <input id="photo" type="url" placeholder="https://…/site-photo.jpg" style="min-width:280px">
    </label>
    <button type="button" id="reload">Refresh</button>
  </div>

  <div class="grid">
    <figure>
      <figcaption>Landscape · 1200×630 · LINE Flex hero</figcaption>
      <img id="img-landscape" alt="Landscape score card">
    </figure>
    <figure>
      <figcaption>Square · 1080×1080</figcaption>
      <img id="img-square" alt="Square score card">
    </figure>
    <figure>
      <figcaption>Story · 1080×1920</figcaption>
      <img id="img-story" alt="Story score card" style="max-width:360px">
    </figure>
  </div>

  <script>
    function refresh() {
      const score = document.getElementById('score').value || 65;
      const photo = document.getElementById('photo').value.trim();
      const q = new URLSearchParams({ score });
      if (photo) q.set('photo', photo);
      const bust = Date.now();
      ['landscape', 'square', 'story'].forEach((format) => {
        const img = document.getElementById('img-' + format);
        img.src = '/api/public/score-card/demo?format=' + format + '&' + q.toString() + '&_=' + bust;
      });
    }
    document.getElementById('reload').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
