<div id="s-visual" class="screen">
  <div class="hdr">
    <button class="hdr-back" type="button" onclick="goBack('s-assess')" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span class="hdr-title" data-i18n="visual.title">Visual Check</span>
  </div>
  <div class="content">
    <div class="visual-section">
      <div class="visual-card">
        <div class="sec-label" data-i18n="visual.waterColour">Water Colour</div>
        <div class="seg" id="seg-colour">
          <div class="seg-opt sel" onclick="selSeg(this,'colour')" data-i18n="visual.clear">Clear</div>
          <div class="seg-opt" onclick="selSeg(this,'colour')" data-i18n="visual.slightTint">Slight Tint</div>
          <div class="seg-opt" onclick="selSeg(this,'colour')" data-i18n="visual.yellowBrown">Yellow / Brown</div>
        </div>
      </div>
    </div>
    <div class="visual-section">
      <div class="visual-card">
        <div class="sec-label" data-i18n="visual.smell">Smell</div>
        <div class="seg" id="seg-smell">
          <div class="seg-opt sel" onclick="selSeg(this,'smell')" data-i18n="visual.none">None</div>
          <div class="seg-opt" onclick="selSeg(this,'smell')" data-i18n="visual.chlorine">Chlorine</div>
          <div class="seg-opt" onclick="selSeg(this,'smell')" data-i18n="visual.earthyMusty">Earthy / Musty</div>
          <div class="seg-opt" onclick="selSeg(this,'smell')" data-i18n="visual.sulphur">Sulphur</div>
          <div class="seg-opt" onclick="selSeg(this,'smell')" data-i18n="visual.metallic">Metallic</div>
          <div class="seg-opt" onclick="selSeg(this,'smell')" data-i18n="visual.other">Other</div>
        </div>
      </div>
    </div>
    <div class="visual-section">
      <div class="visual-card">
        <div class="field"><label><span data-i18n="visual.note">Note</span> <span style="color:var(--muted);font-weight:400" data-i18n="visual.optional">(optional)</span></label><textarea class="inp" id="visual-note" data-i18n-placeholder="visual.notePlaceholder" placeholder="Any observations..."></textarea></div>
      </div>
    </div>
    <div class="visual-section">
      <div class="visual-card">
        <div class="sec-label"><span data-i18n="visual.photo">Photo</span> <span style="color:var(--muted);font-weight:400;text-transform:none" data-i18n="visual.optional">(optional)</span></div>
        <div class="photo-capture">
          <div class="photo-box" onclick="openCameraCapture('vis-photo-input','vis-photo-preview')">
            <img id="vis-photo-preview" src="" style="display:none" alt="">
            <span class="pb-icon"><svg width="20" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
            <span class="pb-label" data-i18n="visual.add">Add</span>
            <span class="photo-status hidden" data-i18n="photo.added">Photo added</span>
            <input type="file" id="vis-photo-input" accept="image/*" onchange="previewPhoto(this,'vis-photo-preview')">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="foot">
    <button class="btn btn-ghost" onclick="goBack('s-assess')" data-i18n="common.cancel">Cancel</button>
    <button class="btn btn-primary" onclick="completeSub('visual-check','s-assess')" data-i18n="common.complete">Complete</button>
  </div>
</div>
