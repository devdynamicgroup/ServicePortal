<div id="s-infra" class="screen">
  <div class="hdr">
    <button class="hdr-back" type="button" onclick="goBack('s-assess')" aria-label="Back"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg></button>
    <span class="hdr-title">Infrastructure</span>
  </div>
  <div class="content gap12">
    <div class="card gap12">
      <div class="field">
        <label>Scale Buildup (0 = none · 10 = severe)</label>
        <input class="inp" id="i-scale" type="number" inputmode="decimal" min="0" max="10" placeholder="3">
      </div>
      <div class="field">
        <label>Pipe Condition (0 = failed · 10 = excellent)</label>
        <input class="inp" id="i-pipe" type="number" inputmode="decimal" min="0" max="10" placeholder="7">
      </div>
      <div class="field">
        <label>Filter Condition (0 = replace · 10 = new)</label>
        <input class="inp" id="i-filter" type="number" inputmode="decimal" min="0" max="10" placeholder="6">
      </div>
      <div class="field"><label>Notes</label><textarea class="inp" id="i-notes" placeholder="Describe condition of pipes, joints, filter..."></textarea></div>
    </div>
  </div>
  <div class="foot">
    <button class="btn btn-ghost" onclick="goBack('s-assess')">Cancel</button>
    <button class="btn btn-primary" onclick="completeSub('infra-check','s-assess')">Complete</button>
  </div>
</div>
